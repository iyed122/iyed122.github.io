<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6470"/>
    </marker>
    <style>
      .box{rx:10;ry:10;stroke-width:1.5;}
      .lbl{font-size:14px;font-weight:600;fill:#1b1f24;}
      .sub{font-size:11px;fill:#4a525c;}
      .tag{font-size:11px;font-weight:600;fill:#fff;}
      .edge{stroke:#5b6470;stroke-width:1.6;fill:none;marker-end:url(#arrow);}
      .title{font-size:20px;font-weight:700;fill:#0f1115;}
    </style>
  </defs>

  <text x="480" y="34" text-anchor="middle" class="title">Automated Twitter Content Crew — Architecture</text>

  <!-- User -->
  <rect x="40" y="70" width="150" height="60" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="115" y="98" text-anchor="middle" class="lbl">User (CLI)</text>
  <text x="115" y="116" text-anchor="middle" class="sub">enters a "niche"</text>

  <!-- Orchestrator -->
  <rect x="270" y="60" width="420" height="80" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="480" y="90" text-anchor="middle" class="lbl">CrewAI Orchestrator — Sequential Process</text>
  <text x="480" y="112" text-anchor="middle" class="sub">main.py · routes context agent → agent · collects usage metrics</text>

  <!-- LLM -->
  <rect x="760" y="70" width="160" height="60" rx="10" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="840" y="94" text-anchor="middle" class="lbl">Groq Cloud</text>
  <text x="840" y="112" text-anchor="middle" class="sub">LLaMA 3 (70B) LLM</text>

  <!-- Agents row -->
  <rect x="40" y="200" width="270" height="110" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <rect x="40" y="200" width="270" height="24" rx="10" fill="#22c55e"/>
  <text x="175" y="217" text-anchor="middle" class="tag">Agent 1 · Trending Topic Researcher</text>
  <text x="175" y="250" text-anchor="middle" class="sub">Finds trending searches in the niche</text>
  <text x="175" y="270" text-anchor="middle" class="sub">Tools: Trends · Search · Browser</text>
  <text x="175" y="292" text-anchor="middle" class="sub">→ list of topics</text>

  <rect x="345" y="200" width="270" height="110" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <rect x="345" y="200" width="270" height="24" rx="10" fill="#22c55e"/>
  <text x="480" y="217" text-anchor="middle" class="tag">Agent 2 · Content Researcher</text>
  <text x="480" y="250" text-anchor="middle" class="sub">Deep research per topic</text>
  <text x="480" y="270" text-anchor="middle" class="sub">Tools: Search · Browser</text>
  <text x="480" y="292" text-anchor="middle" class="sub">→ research map</text>

  <rect x="650" y="200" width="270" height="110" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <rect x="650" y="200" width="270" height="24" rx="10" fill="#22c55e"/>
  <text x="785" y="217" text-anchor="middle" class="tag">Agent 3 · Twitter Content Creator</text>
  <text x="785" y="250" text-anchor="middle" class="sub">Crafts 5 structured tweets</text>
  <text x="785" y="270" text-anchor="middle" class="sub">Tools: Search · Browser</text>
  <text x="785" y="292" text-anchor="middle" class="sub">→ array of tweets</text>

  <!-- Tools layer -->
  <rect x="40" y="370" width="270" height="70" rx="10" fill="#faf5ff" stroke="#a855f7"/>
  <text x="175" y="398" text-anchor="middle" class="lbl">TrendsTools</text>
  <text x="175" y="420" text-anchor="middle" class="sub">pytrends → Google Trends</text>

  <rect x="345" y="370" width="270" height="70" rx="10" fill="#faf5ff" stroke="#a855f7"/>
  <text x="480" y="398" text-anchor="middle" class="lbl">SearchTools</text>
  <text x="480" y="420" text-anchor="middle" class="sub">Serper.dev → Google Search</text>

  <rect x="650" y="370" width="270" height="70" rx="10" fill="#faf5ff" stroke="#a855f7"/>
  <text x="785" y="398" text-anchor="middle" class="lbl">BrowserTools</text>
  <text x="785" y="420" text-anchor="middle" class="sub">requests + BeautifulSoup → LLM summary</text>

  <!-- Output -->
  <rect x="270" y="480" width="200" height="60" rx="10" fill="#fef2f2" stroke="#ef4444"/>
  <text x="370" y="505" text-anchor="middle" class="lbl">Tweet Parser</text>
  <text x="370" y="524" text-anchor="middle" class="sub">LLM → JSON array (main.py)</text>

  <rect x="500" y="480" width="200" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="600" y="505" text-anchor="middle" class="lbl">Tweepy → X/Twitter</text>
  <text x="600" y="524" text-anchor="middle" class="sub">OAuth 1.0a · API v2 post</text>

  <!-- Edges -->
  <path class="edge" d="M190,100 L268,100"/>
  <path class="edge" d="M690,100 L758,100"/>
  <path class="edge" d="M175,140 L175,198"/>
  <path class="edge" d="M480,140 L480,198"/>
  <path class="edge" d="M690,120 Q740,160 785,198"/>
  <path class="edge" d="M310,255 L343,255"/>
  <path class="edge" d="M615,255 L648,255"/>
  <path class="edge" d="M175,310 L175,368"/>
  <path class="edge" d="M480,310 L480,368"/>
  <path class="edge" d="M785,310 L785,368"/>
  <path class="edge" d="M785,312 Q620,420 470,495"/>
  <path class="edge" d="M470,510 L498,510"/>
</svg>
